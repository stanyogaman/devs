<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DEVS: Gaia Kernel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="transition" class="transition hidden"><span>ERA TRANSITION</span><b id="transitionText"></b></div>
  <div id="rewards" class="rewards"></div>
  <div class="app">
    <header>
      <div><h1>DE<span>V</span>S: Gaia Kernel</h1><p id="eraText">Quantum OS booting...</p></div>
      <div class="header-actions"><button id="sound">🔇 Sound</button><button id="save">Save</button><button id="load">Load</button><div id="status" class="pill">CONNECTING</div></div>
    </header>
    <nav class="mobile-nav"><button data-jump="worldPanel">World</button><button data-jump="objectivesPanel">Objectives</button><button data-jump="eventPanel">Events</button><button data-jump="consolePanel">Console</button></nav>
    <main>
      <section id="worldPanel" class="hero panel"><canvas id="world"></canvas><div class="overlay"><h2 id="eraName"></h2><p id="eraDesc"></p><div class="progress"><i id="progress"></i></div></div></section>
      <section class="panel resources"><h3>Core Resources</h3><div id="resources"></div></section>
      <section id="objectivesPanel" class="panel objectives"><h3>Operator Initiation</h3><div id="ora"></div><h3>3 Active Objectives</h3><div id="objectives"></div><h3>Badges</h3><div id="badges"></div></section>
      <section id="eventPanel" class="panel event"><h3>Live Event</h3><div id="event">Awaiting timeline pressure...</div></section>
      <section class="panel missions"><h3>Missions</h3><div id="missions"></div><h3>Technology Tree</h3><div id="tech"></div></section>
      <section class="panel upgrades"><h3>Tycoon Modules</h3><div id="upgrades"></div></section>
      <section id="consolePanel" class="panel console"><h3>Command Console</h3><div id="log"></div><form id="cmdForm"><input id="cmd" autocomplete="off" placeholder="HELP, STATUS, QEC, PATCH ethics, UPGRADE ethics-kernel"><button>RUN</button></form><h3>Custom Patch Editor</h3><textarea id="patch" placeholder="validate ethics; monitor biosphere; feedback; audit; stabilize..."></textarea><button id="compile">COMPILE SAFE PATCH</button><textarea id="importBox" placeholder="Paste exported save JSON here"></textarea></section>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script><script src="/client.js"></script>
</body>
</html>
